{% extends "base.html" %}
{% block title %}Log in — Stock Ledger{% endblock %}
{% block full %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Stock Ledger</h1>
    <p class="subtitle" style="text-align:center;">Sign in to continue</p>
    {% if form.errors %}<div class="toast error">Invalid username or password.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div>
        <label>Username</label>
        <input type="text" name="username" autofocus required style="width:100%;">
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" required style="width:100%;">
      </div>
      <button type="submit" class="primary-btn" style="margin-top:6px;">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
